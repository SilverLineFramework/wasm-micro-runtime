name: WALI Test Suite

on:
  push:
    branches: [wali]
  pull_request:
    branches: [wali]
  workflow_dispatch:

jobs:
  wali-test-suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      IWASM: ${{ github.workspace }}/wali/build/wamr/iwasm/iwasm --stack-size=4194304
    steps:
      - name: Checkout current wasm-micro-runtime
        uses: actions/checkout@v4
        with:
          path: wmr-current
          submodules: false

      - name: Checkout WALI
        uses: actions/checkout@v4
        with:
          repository: Wasm-Thin-Kernel-Interfaces/WALI
          path: wali
          submodules: false

      - name: Replace WALI's wasm-micro-runtime with this checkout
        run: |
          rm -rf wali/wasm-micro-runtime
          cp -a wmr-current wali/wasm-micro-runtime
          rm -rf wali/wasm-micro-runtime/.git

      - name: Install dependencies
        working-directory: wali
        run: sudo ./install-deps.sh

      - name: Generate toolchain configs
        working-directory: wali
        run: python3 toolchains/gen_toolchains.py

      - name: Build iwasm (from current wasm-micro-runtime)
        working-directory: wali
        run: make iwasm

      - name: Build native test binaries
        working-directory: wali
        run: make -C tests native

      - name: Setup iwasm symlink for run_tests.py
        working-directory: wali
        run: ln -sf "$PWD/build/wamr/iwasm/iwasm" iwasm

      - name: Run test suite
        working-directory: wali/tests
        run: python3 run_tests.py

      - name: Test bash (precompiled)
        working-directory: wali/examples/precompiled/bash
        run: |
          out=$($IWASM bash.wasm test.sh)
          echo "$out"
          echo "$out" | grep -q "Hello from WALI bash"
          echo "$out" | grep -q "sum: 6"
          echo "$out" | grep -q "read back: wali-bash-payload"

      - name: Test lua (precompiled)
        working-directory: wali/examples/precompiled/lua
        run: |
          out=$($IWASM lua.wasm test.lua)
          echo "$out"
          echo "$out" | grep -q "Hello from WALI lua"
          echo "$out" | grep -q "sum(10):.*55"
          echo "$out" | grep -q "fact(5):.*120"

      - name: Test sqlite (precompiled)
        working-directory: wali/examples/precompiled/sqlite
        run: |
          out=$($IWASM sqlite3.wasm chinook.db ".read list_albums.sql")
          echo "$out"
          echo "$out" | grep -q "Ace Of Spades"

      - name: Test vim (precompiled)
        working-directory: wali/examples/precompiled
        run: |
          $IWASM vim.wasm -n -u NONE -es -c "put! ='Hello from CI'" -c "wq" /tmp/vim_testfile.txt
          grep -q "Hello from CI" /tmp/vim_testfile.txt
